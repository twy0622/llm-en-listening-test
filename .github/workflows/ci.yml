name: CI

on:
  push:
    branches: [main, feature/enhancement]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Worker and web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build the SPA
        run: npm run build

      - name: Verify the Worker bundle
        run: npx wrangler deploy --dry-run
        working-directory: apps/api

  pipeline:
    name: Content factory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The test suite is text-only. Kokoro/Torch are intentionally omitted so
      # CI stays fast; audio synthesis is exercised locally before a release.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx pydantic python-dotenv pytest
          pip install -e ./pipeline --no-deps

      - name: Unit tests
        run: python -m pytest -q
        working-directory: pipeline
